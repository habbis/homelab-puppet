---
version: 5
defaults:
  datadir: data
  # datadir: "/etc/puppetlabs/code/environments/%{environment}/data"
  data_hash: yaml_data
hierarchy:
  - name: 'YAML hierarchy levels'
    paths:
      - 'nodes/%{trusted.certname}.yaml'
      - 'hosters/%{hoster}.yaml'
  - name: 'Common secret data'
    lookup_key: eyaml_lookup_key
    paths:
      - 'secrets/common.eyaml'
    options:
      #  linux
      pkcs7_private_key: /etc/puppetlabs/puppet/eyaml/private_key.pkcs7.pem
      pkcs7_public_key: /etc/puppetlabs/puppet/eyaml/public_key.pkcs7.pem
      # freebsd
      #pkcs7_private_key: /usr/local/etc/puppet/eyaml/private_key.pkcs7.pem
      #pkcs7_public_key: /usr/local/etc/puppet/eyaml/public_key.pkcs7.pem
  - name: "More common options"
    glob: "common/*.yaml"
  - name: "Common YAML hierarchy level"
    path: 'common.yaml'
