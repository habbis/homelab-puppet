---
classes:
  - server_lite


server_lite::ntp_pool: 'pool.habbfarm.net'
server_lite::search: 'no.habbfarm.net habbfarm.net ncop.no dc1.ncop.no'
server_lite::nameserver1: '10.17.2.2'
server_lite::nameserver2: '10.17.2.3'
server_lite::ntp_server: false
server_lite::dns_resolver: false
server_lite::proxy_server: 'hf-proxy.no.habbfarm.net:8888'
server_lite::no_proxy: '0.0.0.0/0,localhost,.habbfarm.net,.no.habbfarm.net,.ncop.no'
server_lite::set_proxy_server: true

patching_as_code::patch_schedule:
  group_monday:
    day_of_week: Monday
    count_of_week: [3, 4]
    hours: 20:00 - 22:00
    max_runs: 3
    reboot: never
  group_tuesday:
    day_of_week: tuesday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_wednesday:
    day_of_week: Wednesday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_thursday:
    day_of_week: Thursday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_friday:
    day_of_week: Friday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_saturday:
    day_of_week: Saturday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_sunday:
    day_of_week: Sunday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
