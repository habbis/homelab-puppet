---
classes:
  - server_lite


server_lite::ntp_pool: 'pool.habbfarm.net'
server_lite::search: 'no.habbfarm.net habbfarm.net ncop.no dc1.ncop.no'
server_lite::nameserver1: '10.17.2.2'
server_lite::nameserver2: '10.17.2.3'
server_lite::ntp_server: false

patching_as_code::patch_schedule:
  group_sunday:
    day_of_week: Sunday
    count_of_week: 2
    hours: 10:00 - 11:00
    max_runs: 3
    reboot: ifneeded
  group_monday:
    day_of_week: Monday
    count_of_week: [3, 4]
    hours: 20:00 - 22:00
    max_runs: 3
    reboot: never
